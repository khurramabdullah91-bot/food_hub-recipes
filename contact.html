<!DOCTYPE html>
<html>
<head>
<title>Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-nav">
  <div class="container">

    <a class="navbar-brand fw-bold" href="index.html">🍲 FoodHub</a>

    <div>
      <a class="nav-link d-inline" href="index.html">Home</a>
      <a class="nav-link d-inline" href="about.html">About</a>
      <a class="nav-link d-inline" href="contact.html">Contact</a>

      <!-- DARK MODE BUTTON -->
<button onclick="toggleDark()" class="btn btn-light ms-3">
  🌙
</button>
    </div>

  </div>
</nav>

<div class="container mt-5">
  <h1 class="text-center">Contact Us</h1>

  <form>
    <input class="form-control mb-3" type="text" placeholder="Your Name">
    <input class="form-control mb-3" type="email" placeholder="Your Email">
    <textarea class="form-control mb-3" placeholder="Message"></textarea>
    <button class="btn btn-custom">Send</button>
  </form>
</div>

<script>

/* Load saved theme */
if(localStorage.getItem("theme") === "dark"){
  document.body.classList.add("dark");
}

/* Toggle */
function toggleDark(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("theme","dark");
  }else{
    localStorage.setItem("theme","light");
  }
}

</script>

</body>
</html>
