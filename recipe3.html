<h1>🍛 Daal Chawal</h1>

<img src="/images/dall chawal.jfif" 
style="width:80%;display:block;margin:auto;border-radius:15px;">

<div class="content">

<h2>🧾 Ingredients</h2>
<ul>
<li>Lentils – 1 cup</li>
<li>Rice – 2 cups</li>
<li>Onion – 1</li>
<li>Garlic – 4 cloves</li>
<li>Oil – 2 tbsp</li>
<li>Salt – 1 tsp</li>
</ul>

<h2>👨‍🍳 Steps</h2>
<p>
1. Boil lentils 🍲<br>
2. Cook rice 🍚<br>
3. Fry onions 🧅<br>
4. Mix & serve 😋
</p>

<h2>💡 Tips</h2>
<p>Add lemon for better taste 🍋</p>

</div>

<div class="footer">🍲 FoodHub © 2026</div>

<script>

/* Load saved theme */
if(localStorage.getItem("theme") === "dark"){
  document.body.classList.add("dark");
}

/* Toggle */
function toggleDark(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("theme","dark");
  }else{
    localStorage.setItem("theme","light");
  }
}

</script>

</body>
