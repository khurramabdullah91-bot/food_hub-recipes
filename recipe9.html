<h1>🍨 Ice Cream</h1>

<img src="/images/ice cream.jfif" style="width:80%;display:block;margin:auto;border-radius:15px;">

<div class="content">

<h2>🧾 Ingredients</h2>
<ul>
<li>Milk – 2 cups</li>
<li>Cream – 1 cup</li>
<li>Sugar – 1/2 cup</li>
<li>Vanilla essence – 1 tsp</li>
</ul>

<h2>👨‍🍳 Steps</h2>
<p>
1. Mix ingredients 🥛<br>
2. Freeze ❄️<br>
3. Serve cold 🍨
</p>

<h2>💡 Tips</h2>
<p>Freeze at least 6 hours 🧊</p>

</div>

<div class="footer">🍲 FoodHub © 2026</div>

<script>

/* Load saved theme */
if(localStorage.getItem("theme") === "dark"){
  document.body.classList.add("dark");
}

/* Toggle */
function toggleDark(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("theme","dark");
  }else{
    localStorage.setItem("theme","light");
  }
}

</script>

</body>
