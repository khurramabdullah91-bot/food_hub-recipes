<h1>🍝 Pasta</h1>

<div class="content">

<h2>🧾 Ingredients</h2>
<ul>
<li>Pasta – 2 cups</li>
<li>Cream – 1 cup</li>
<li>Chicken – 200g</li>
<li>Garlic – 3 cloves</li>
<li>Butter – 2 tbsp</li>
</ul>

<h2>👨‍🍳 Steps</h2>
<p>
1. Boil pasta 🍝<br>
2. Cook chicken 🍗<br>
3. Add cream 🥛<br>
4. Mix & serve 🔥
</p>

<h2>💡 Tips</h2>
<p>Don’t overcook pasta ⏳</p>

</div>

<div class="footer">🍲 FoodHub © 2026</div>

<script>

/* Load saved theme */
if(localStorage.getItem("theme") === "dark"){
  document.body.classList.add("dark");
}

/* Toggle */
function toggleDark(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("theme","dark");
  }else{
    localStorage.setItem("theme","light");
  }
}

</script>
