<h1>🍰 Chocolate Cake</h1>

<img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c" style="width:80%;display:block;margin:auto;border-radius:15px;">

<div class="content">

<h2>🧾 Ingredients</h2>
<ul>
<li>Flour – 2 cups</li>
<li>Sugar – 1 cup</li>
<li>Eggs – 2</li>
<li>Cocoa powder – 1/2 cup</li>
<li>Milk – 1 cup</li>
</ul>

<h2>👨‍🍳 Steps</h2>
<p>
1. Mix ingredients 🎂<br>
2. Bake 180°C 🔥<br>
3. Cool & serve 😋
</p>

<h2>💡 Tips</h2>
<p>Don’t overbake or cake will dry 🍰</p>

</div>

<div class="footer">🍲 FoodHub © 2026</div>

<script>

/* Load saved theme */
if(localStorage.getItem("theme") === "dark"){
  document.body.classList.add("dark");
}

/* Toggle */
function toggleDark(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("theme","dark");
  }else{
    localStorage.setItem("theme","light");
  }
}

</script>

</body>
